nameOverride: ""
image:
  repository: harbor.company.internal/locate360/user-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 80
  targetPort: 3000
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: user-service.locate360.internal
  path: /

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

configMap:
  data: {}

secret:
  # Populated at deploy time from Vault via Jenkins — never committed with real values.
  data: {}

vault:
  enabled: true
  path: secret/data/locate360/user-service
