---
- name: Configure all Kubernetes nodes (common prerequisites)
  hosts: k8s_cluster
  become: true
  roles:
    - docker
    - containerd
    - k8s-common

- name: Initialize Kubernetes master
  hosts: k8s_master
  become: true
  roles:
    - k8s-master

- name: Join worker nodes to cluster
  hosts: k8s_workers
  become: true
  roles:
    - k8s-worker
